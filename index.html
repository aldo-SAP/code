<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home/style.css">
<link rel="stylesheet" href="shared/nav.css">
</head>
<body>
<nav id="toolsNav" aria-label="Site"><h1>Tools</h1><span>Runs locally in your browser</span></nav>
<main>
  <div class="top">
    <p id="summary"></p>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Find a tool…" aria-label="Find a tool" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </label>
  </div>
  <div id="groups"></div>
  <p class="empty" id="empty" hidden>No tool matches “<span id="q"></span>”.</p>
  <p class="foot">Everything runs in your browser; files you open are never uploaded, except in Menu Reader’s optional Claude mode.</p>
</main>
<script src="home/app.js"></script>
</body>
</html>
